name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  check-content:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.content.outputs.ready }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check portfolio content
        id: content
        shell: bash
        run: |
          if [ -s site/index.html ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Waiting for the portfolio pages and assets. Deployment skipped.' >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: check-content
    if: needs.check-content.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: site
      - name: Wait for artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          for attempt in {1..12}; do
            count=$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" -f "name=${ARTIFACT_NAME}" --jq '.total_count')
            if [ "$count" -eq 1 ]; then
              sleep 3
              exit 0
            fi
            sleep 5
          done
          echo '::error::The Pages artifact is not visible in the Actions API yet.'
          exit 1
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
